<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <title>NetCloud Academy</title>
    <!-- Farbschema vor dem ersten Rendern setzen (sonst blitzt kurz das dunkle Schema auf), Logik wie in src/lib/theme.ts -->
    <script>
      try {
        var t = localStorage.getItem('netcloud-theme');
        if (t === 'light' || (t !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
